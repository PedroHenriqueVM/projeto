<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Horas Extras</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="topo">
            <a href="../index.html" class="btn-voltar">← Voltar</a>
            <div class="data-hora">
                <span id="data"></span>
                <span id="hora"></span>
            </div>
        </div>
        
        <h1>Cálculo Horas Extras</h1>
        
        <div class="content">
            <div class="card input-card">
                <label>Salário Mensal</label>
                <input type="number" id="salario" placeholder="Digite seu salário" autocomplete="off"">

                <label>Horas extras (dias úteis)</label>
                <input type="number" id="horasNormais" placeholder="Horas extras" autocomplete="off">

                <label>Horas extras (fim de semana)</label>
                <input type="number" id="horasFimSemana" placeholder="Horas extras" autocomplete="off">

                <button onclick="calcular()">Calcular</button>
            </div>

            <div class="card result-card">
                <p>Valor das Horas Extras:</p>
                <input type="text" id="valorExtras" readonly>

                <p>Valor Salário Atual:</p>
                <input type="text" id="salarioAtual" readonly>

                <p class="final">Salário a Receber:</p>
                <input type="text" id="resultado" readonly class="resultado-final">
            </div>
        </div>
    </div>
    
    <script src="codigo.js"></script>
    <script src="../script.js"></script>
</body>

</html>
