<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Aumento de Salário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="topo">
            <a href="../index.html" class="btn-voltar">← Voltar</a>
            <div class="data-hora">
                <span id="data"></span>
                <span id="hora"></span>
            </div>
        </div>
        
        <h1>Aumento de Salário</h1>

        <div class="content">
            <div class="card input-card">
                <label>Digite o salário do funcionário</label>
                <input type="number" id="salario" placeholder="Salário atual" autocomplete="off">
                <button onclick="calcular()">Calcular</button>
            </div>

            <div class="card result-card">
                <label>Percentual de aumento</label>
                <input type="text" id="percentual" readonly>

                <label>Valor do aumento</label>
                <input type="text" id="aumento" readonly>

                <label>Novo salário</label>
                <input type="text" id="resultado" readonly>
            </div>
        </div>
    </div>
    
    <script src="codigo.js"></script>
    <script src="../script.js"></script>
</body>

</html>
